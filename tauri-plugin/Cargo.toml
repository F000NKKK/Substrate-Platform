[package]
name = "tauri-plugin-substrate"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["F000NK"]
license = "AGPL-3.0-only"
description = "Substrate Platform's host commands for a Tauri app: the workspace boundary, opening links, Source Control, terminals — what Substrate's UI calls, the same in every product."
repository = "https://github.com/F000NKKK/Substrate-Platform"
# Tauri wants a plugin's links key: its permissions are found by it.
links = "tauri-plugin-substrate"

# Each command group is a feature of its name, turning on the core's module.
[features]
fs = ["substrate-platform/fs"]
git = ["substrate-platform/git"]
lsp = ["substrate-platform/lsp", "dep:serde_json"]
search = ["substrate-platform/search"]
state = ["substrate-platform/state", "dep:serde_json"]
terminal = ["substrate-platform/terminal"]

[lints]
workspace = true

[dependencies]
substrate-platform = { path = ".." }
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }

[build-dependencies]
substrate-platform = { path = ".." }
tauri-plugin = { version = "2", features = ["build"] }
