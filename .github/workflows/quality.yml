# Craftbook quality gates (craftbook rust/08-testing-and-quality.md §8.5),
# adapted from craftbook templates/ci.yml for the migration in
# craftbook adoption/substrate-platform.md. The lint set stays at `warn` for
# quick local builds; CI runs clippy with `-D warnings`, so any warning fails.
name: quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings -D rustdoc::all
  # The Craftbook version this project follows; bumped by the project's own PR.
  CRAFTBOOK_REF: main
  # `tauri-plugin` links GTK and WebKitGTK on Linux.
  TAURI_SYSTEM_LIBS: >-
    libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
    libayatana-appindicator3-dev librsvg2-dev

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: F000NKKK/craftbook
          ref: ${{ env.CRAFTBOOK_REF }}
          path: .craftbook
      - run: sudo apt-get update && sudo apt-get install -y $TAURI_SYSTEM_LIBS
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: python3 .craftbook/tools/craftcheck check . --baseline .craftcheck-baseline
      - run: python3 .craftbook/tools/craftcheck deps . --baseline .craftcheck-deps-baseline

  fmt-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check -- --config group_imports=StdExternalCrate,imports_granularity=Module

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y $TAURI_SYSTEM_LIBS
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-deny
      # Every module is a feature: default features would skip most tests.
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --all-features --doc
      # Floors by layer (chapter 8 §8.1): shared kernel 95 %, domain 90 %, app
      # 85 %, adapters 70 % of lines. A crate below its floor is reported and
      # held to its measured ratchet (.github/scripts/coverage_floors.py).
      - name: coverage floors by layer
        run: |
          cargo llvm-cov --workspace --all-features --json --summary-only --output-path coverage.json
          python3 .github/scripts/coverage_floors.py coverage.json
      - run: cargo deny check
      - run: cargo doc --workspace --no-deps --all-features

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
