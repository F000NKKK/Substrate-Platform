name: Windows terminal
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  powershell:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p substrate-terminal-pty --all-targets -- -D warnings
      - run: cargo test -p substrate-terminal-pty --test powershell --locked
