name: One-time dependency security lock refresh
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/refresh-lock-once.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'
      - name: Upgrade vulnerable transitive crates
        run: |
          set -euo pipefail
          cargo update -p url --precise 2.5.9
          cargo update -p cookie --precise 0.18.3
      - name: Commit updated Cargo.lock
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already patched"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'build: update url and cookie to patched releases'
          git push origin HEAD:master
