# Craftbook cargo-deny baseline. Copy to the workspace root as deny.toml.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences only; add a licence here by Craftbook PR, not locally.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

# The workspace's own crates carry the project's licence (AGPL here), so each
# published one is an exception by name; third-party crates stay checked.
[licenses.private]
ignore = true

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-platform"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "tauri-plugin-substrate"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-message"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-host-contract"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-git-domain"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-git-app"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-git-gitcli"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-search-domain"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-search-app"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-search-ignore"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
