# Craftbook cargo-deny baseline. Copy to the workspace root as deny.toml.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Pulled in only by Tauri's GTK3 bindings (glib-macros); not ours to replace.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is a build-time dependency of glib-macros under tauri; no upstream replacement yet" },
]

[licenses]
version = 2
# Permissive licences only; add a licence here by Craftbook PR, not locally.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

# The workspace's own crates carry the project's licence (AGPL here), so each
# published one is an exception by name; third-party crates stay checked.
[licenses.private]
ignore = true

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "tauri-plugin-substrate"

[[licenses.exceptions]]
