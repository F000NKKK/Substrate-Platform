# Craftbook cargo-deny baseline. Copy to the workspace root as deny.toml.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Pulled in only by Tauri's GTK3 bindings (glib-macros); not ours to replace.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is a build-time dependency of glib-macros under tauri; no upstream replacement yet" },
]

[licenses]
version = 2
# Allow-list policy (owner decision, 2026-10-28): every permissive licence whose
# only obligation is to keep the copyright notice / licence text is allowed.
# Copyleft (GPL, LGPL, AGPL, EUPL, ...) and licences with other obligations
# (SSPL, BUSL, "non-commercial") stay denied. Add a licence here by Craftbook PR,
# not locally.
allow = [
    # MIT family and public-domain-like
    "MIT",
    "MIT-0",
    "X11",
    "Unlicense",
    "CC0-1.0",
    "0BSD",
    "WTFPL",
    # Apache family
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # BSD family
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-3-Clause-Clear",
    # ISC / zlib / other short permissive licences
    "ISC",
    "Zlib",
    "libpng-2.0",
    "BSL-1.0",
    "NCSA",
    "PostgreSQL",
    "Python-2.0",
    "curl",
    "W3C",
    "bzip2-1.0.6",
    "OpenSSL", # ring/rustls on older releases: notice + advertising clause, GPL-incompatible
    # Unicode data
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # Data licences: attribution only
    "CC-BY-4.0",
    "CDLA-Permissive-1.0",
    "CDLA-Permissive-2.0",
    # File-level weak copyleft, accepted since it does not reach our code
    "MPL-2.0",
]
confidence-threshold = 0.9

# The workspace's own crates carry the project's licence (AGPL here), so each
# published one is an exception by name; third-party crates stay checked.
[licenses.private]
ignore = true

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "tauri-plugin-substrate"

