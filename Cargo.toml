# The core and its Tauri plugin (`tauri-plugin/`): one target dir.
[workspace]
members = ["tauri-plugin"]

# Craftbook's lint set (templates/workspace-lints.toml). Wave 0 of the
# migration (craftbook adoption/substrate-platform.md §4) turns every `deny`
# into `warn`, so the build stays green while the backlog is worked off;
# wave 11 turns them back to `deny`.
[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "warn"
too_many_arguments = "warn"
excessive_nesting = "warn"
cognitive_complexity = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
module_name_repetitions = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unreachable = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
wildcard_imports = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
mod_module_files = "allow"
self_named_module_files = "warn"
large_types_passed_by_value = "warn"
shadow_unrelated = "warn"

[package]
name = "substrate-platform"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
authors = ["F000NK"]
description = "Brand-neutral IDE platform core (task/workflow runner, log sink, PTY sessions, directory + project/solution engines) — the shared backend foundation for future IDE-style tools."
license = "AGPL-3.0-only"
repository = "https://github.com/F000NKKK/Substrate-Platform"

# Each module beyond the core is a feature of its name; a product turns on
# what it uses.
[features]
# The debug adapters: `dap` starts them through `run` and reads their
# adapter list from TOML.
dap = ["run", "dep:serde_json"]
fs = ["dep:notify"]
git = []
# The language servers: `lsp` starts them through `run` and reads their
# language list from TOML.
lsp = ["run", "dep:serde_json"]
project = []
run = ["dep:toml", "dep:libc"]
search = ["dep:globset", "dep:ignore", "dep:regex"]
state = ["dep:serde_json"]
terminal = ["dep:anyhow", "dep:portable-pty"]
full = ["dap", "fs", "git", "lsp", "project", "run", "search", "state", "terminal"]

[lints]
workspace = true

[dependencies]
anyhow = { version = "1", optional = true }
globset = { version = "0.4.20", optional = true }
ignore = { version = "0.4.33", optional = true }
regex = { version = "1.13.1", optional = true }
notify = { version = "8", optional = true }
portable-pty = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
thiserror = "2"
toml = { version = "1", optional = true }

# `kill(-pgid, ...)` — cancelling a task kills its whole process group (see
# `run::task::kill_tree`).
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
toml = "1"

# The UI's generated copy covers every module's messages.
[[bin]]
name = "substrate-messages"
required-features = ["full"]

[[bench]]
name = "core"
harness = false
required-features = ["fs", "run", "terminal"]
