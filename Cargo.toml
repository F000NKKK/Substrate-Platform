# The core and its Tauri plugin (`tauri-plugin/`): one target dir.
[workspace]
members = ["tauri-plugin"]

[package]
name = "substrate-platform"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
authors = ["F000NK"]
description = "Brand-neutral IDE platform core (task/workflow runner, log sink, PTY sessions, directory + project/solution engines) — the shared backend foundation for future IDE-style tools."
license = "AGPL-3.0-only"
repository = "https://github.com/F000NKKK/Substrate-Platform"

# Each module beyond the core is a feature of its name; a product turns on
# what it uses.
[features]
fs = ["dep:notify"]
git = []
project = []
run = ["dep:anyhow", "dep:toml", "dep:libc"]
search = ["dep:globset", "dep:ignore", "dep:regex"]
state = ["dep:serde_json"]
terminal = ["dep:anyhow", "dep:portable-pty"]
full = ["fs", "git", "project", "run", "search", "state", "terminal"]

[dependencies]
anyhow = { version = "1", optional = true }
globset = { version = "0.4.20", optional = true }
ignore = { version = "0.4.33", optional = true }
regex = { version = "1.13.1", optional = true }
notify = { version = "8", optional = true }
portable-pty = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
toml = { version = "1", optional = true }

# `kill(-pgid, ...)` — cancelling a task kills its whole process group (see
# `run::task::kill_tree`).
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
toml = "1"

# The UI's generated copy covers every module's messages.
[[bin]]
name = "substrate-messages"
required-features = ["full"]

[[bench]]
name = "core"
harness = false
required-features = ["fs", "run", "terminal"]
