[package]
name = "substrate-installer-json"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["F000NK"]
description = "The installer's records of what is installed, kept as one versioned JSON file written atomically."
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/F000NKKK/Substrate-Platform"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
substrate-installer-app = { version = "0.1.0", path = "../substrate-installer-app" }
substrate-installer-domain = { version = "0.1.0", path = "../substrate-installer-domain" }
substrate-lock = { version = "0.1.0", path = "../substrate-lock" }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
