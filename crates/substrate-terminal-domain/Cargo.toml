[package]
name = "substrate-terminal-domain"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["F000NK"]
description = "A terminal's vocabulary: its size, the shells a machine offers, what to start in a session, output decoded as it streams, and why a session fails."
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/F000NKKK/Substrate-Platform"

[lints]
workspace = true

[dependencies]
substrate-message = { version = "0.1.0", path = "../substrate-message" }
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "utf8_chunker"
harness = false
