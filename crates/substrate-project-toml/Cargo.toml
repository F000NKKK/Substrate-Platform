[package]
name = "substrate-project-toml"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["F000NK"]
description = "Reads a product's list of project standards from TOML into the project model's vocabulary."
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/F000NKKK/Substrate-Platform"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
substrate-project-domain = { version = "0.1.0", path = "../substrate-project-domain" }
toml = "1"

[dev-dependencies]
substrate-message = { version = "0.1.0", path = "../substrate-message" }
