[package]
name = "substrate-installer-http"
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
authors = ["F000NK"]
description = "HTTP adapters of the installer ports: GitHub and crates.io release listing with an ETag cache, and a resumable, verified, cancellable downloader."
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/F000NKKK/Substrate-Platform"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
substrate-installer-app = { version = "0.1.2", path = "../substrate-installer-app" }
substrate-installer-domain = { version = "0.1.2", path = "../substrate-installer-domain" }
thiserror = "2"
ureq = "3"

[dev-dependencies]
tempfile = "3"
