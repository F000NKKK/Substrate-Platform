[package]
name = "substrate-terminal-pty"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
authors = ["F000NK"]
description = "A terminal on a real, cross-platform pty (Windows, Linux, macOS) through portable-pty, and shell detection on the search path."
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/F000NKKK/Substrate-Platform"

[lints]
workspace = true

[dependencies]
portable-pty = "0.9"
substrate-process = { version = "0.1.0", path = "../substrate-process" }
substrate-terminal-app = { version = "0.1.0", path = "../substrate-terminal-app" }
substrate-terminal-domain = { version = "0.1.0", path = "../substrate-terminal-domain" }
