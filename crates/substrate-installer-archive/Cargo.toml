[package]
name = "substrate-installer-archive"
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
authors = ["F000NK"]
description = "Unpacks an installer's downloads: zip, tar.gz, tar.xz and a Debian package's files, from a file or a stream, never outside the folder."
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/F000NKKK/Substrate-Platform"

[lints]
workspace = true

[dependencies]
flate2 = "1"
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz"] }
substrate-installer-app = { version = "0.1.2", path = "../substrate-installer-app" }
substrate-installer-domain = { version = "0.1.2", path = "../substrate-installer-domain" }
tar = "0.4"
tempfile = "3"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz", "encoder"] }
