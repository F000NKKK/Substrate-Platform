[package]
name = "substrate-run-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["F000NK"]
description = "Running tools' use cases: spawn a task with its output streamed into a log, run workflows step by step, and the port for starting processes."
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/F000NKKK/Substrate-Platform"

[lints]
workspace = true

[dependencies]
substrate-run-domain = { version = "0.1.0", path = "../substrate-run-domain" }
substrate-lock = { version = "0.1.0", path = "../substrate-lock" }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "log_sink"
harness = false
