[package]
name = "substrate-installer-toml"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["F000NK"]
description = "Reads an installer's catalog file (TOML) and a release's compatibility manifest (JSON) into the installer context's vocabulary, naming the line and field of every problem."
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/F000NKKK/Substrate-Platform"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
substrate-installer-domain = { version = "0.1.0", path = "../substrate-installer-domain" }
thiserror = "2"
toml = "1"
