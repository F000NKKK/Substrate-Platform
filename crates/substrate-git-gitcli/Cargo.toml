[package]
name = "substrate-git-gitcli"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["F000NK"]
description = "Source control through the git executable: the adapter of substrate-git-app's ports, and the anticorruption layer for git's porcelain output."
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/F000NKKK/Substrate-Platform"

[lints]
workspace = true

[dependencies]
substrate-git-app = { version = "0.1.0", path = "../substrate-git-app" }
substrate-git-domain = { version = "0.1.0", path = "../substrate-git-domain" }
substrate-message = { version = "0.1.0", path = "../substrate-message" }
substrate-process = { version = "0.1.0", path = "../substrate-process" }
substrate-platform = { version = "0.4.0", path = "../.." }
