readme = "README.md"
repository = "https://github.com/F000NKKK/Substrate-Platform"

[lints]
workspace = true

[dependencies]
substrate-lock = { version = "0.1.0", path = "../substrate-lock" }
substrate-terminal-domain = { version = "0.1.0", path = "../substrate-terminal-domain" }
