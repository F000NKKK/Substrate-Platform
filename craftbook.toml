# Layer and context map for craftcheck (craftbook rust/06-tooling.md §6.3).
# Today's single-crate map, copied from craftbook adoption/substrate-platform;
# the target map of that page replaces it with the crate split (wave 5).
[[crate]]
name = "substrate-platform"
layer = "infra"      # really mixed: shared-kernel + domain + app + infra + interface (commands, events)
context = "substrate"
[[crate]]
name = "substrate-git-domain"
layer = "domain"
context = "source-control"
[[crate]]
name = "substrate-git-app"
layer = "app"
context = "source-control"
[[crate]]
name = "substrate-git-gitcli"
layer = "infra"
context = "source-control"
[[crate]]
name = "tauri-plugin-substrate"
layer = "interface"
context = "host-ui-contract"
[[crate]]
name = "substrate-message"
layer = "shared-kernel"
context = "message"
[[crate]]
name = "substrate-host-contract"
layer = "interface"
context = "host-ui-contract"

# The core is one context until the split reaches it (waves 6-10).
[[context_edge]]
from = "host-ui-contract"
to = "substrate"
relation = "customer-supplier"
[[context_edge]]
from = "host-ui-contract"
to = "message"
relation = "published-language"
[[context_edge]]
from = "substrate"
to = "message"
relation = "shared-kernel"
[[context_edge]]
from = "source-control"
to = "substrate"
relation = "customer-supplier"
[[context_edge]]
from = "source-control"
to = "message"
relation = "shared-kernel"
[[context_edge]]
from = "host-ui-contract"
to = "source-control"
relation = "customer-supplier"
